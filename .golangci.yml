# golangci-lint v2. Migrated from the v1 schema with `golangci-lint migrate`; the
# explanatory comments are hand-restored, because the reasons matter more than the list.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused

  settings:
    govet:
      enable:
        - printf
      # `shadow` is deliberately not enabled. It reported 148 findings, every one of
      # them `err` shadowed by an inner `if err := f(); err != nil` — which is
      # idiomatic Go, and which the check cannot be told to ignore. Burying the printf
      # findings under that would cost more than the check is worth. The shadowing that
      # actually bites is a *different* variable reused in an inner scope, and review
      # catches that better than a linter that cries wolf 148 times.

    gosec:
      excludes:
        # ratline runs external commands by design; the argv-only Runner plus the
        # binary registry is the mitigation, and it is tested.
        - G204
        # File modes are chosen deliberately and asserted in tests.
        - G302
        - G306
        # False positive on `if i+1 >= len(args) { return }; i++; args[i]` in
        # ratline-shell's flag parser — the bounds check is there, one line above the
        # increment, and gosec does not follow it.
        - G602
        # ratline-shell exists to exec the program it was asked for. It resolves an
        # absolute path from an allowlist and passes an argv slice to syscall.Exec;
        # there is no shell anywhere in the path. Taint analysis cannot see that.
        - G702
        # Every flagged query concatenates *hardcoded* predicates ("owner = ?") and
        # binds the values through QueryContext's args. Nothing user-supplied reaches
        # the SQL string.
        - G202
        # UID and GID cross the syscall boundary as uint32. They come from the passwd
        # database, not from input, and a negative one is not representable there.
        - G115
        # Both sites set InsecureSkipVerify to do the verification by hand a few lines
        # later, so that a chain problem can be reported separately from a name
        # mismatch — see VerifyServed. Delegating to crypto/tls would collapse the two
        # into one unhelpful error.
        - G402
        # The runtime installer walks a root-owned directory tree it has just created.
        - G122

    forbidigo:
      forbid:
        # Shelling out through a shell is the one thing this codebase must never
        # do. The Runner takes an argv slice; there is no shell in the registry.
        - pattern: ^exec\.Command$
          msg: use system.Runner, which takes an argv slice and resolves the binary by absolute path
        - pattern: sh -c
          msg: ratline never invokes a shell; put the pipeline in a script inside the repository
      exclude-godoc-examples: false

    errcheck:
      exclude-functions:
        # Deliberate: a failed close on a read-only handle changes nothing.
        - (io.Closer).Close

    staticcheck:
      checks:
        - all
        # QF* are opinionated refactorings — "could apply De Morgan's law" — not
        # correctness findings. The SA and S families stay on.
        - -QF1001
        - -QF1008

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # The wrapper execs into the requested program, so os/exec use is the point.
      - path: cmd/ratline-shell/main\.go
        linters:
          - forbidigo
      # This test builds and drives the real binary under a pty, which is the only way
      # to exercise the interactive paths at all. It has to start a process.
      - path: internal/cli/pty_test\.go
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
