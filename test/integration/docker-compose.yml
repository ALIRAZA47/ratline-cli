# The integration harness.
#
# A real Ubuntu container with real nginx, real systemd, real Node and real
# Python, plus a local ACME server. The unit tests cover rendering and
# validation; this covers the things only a real system can tell you — whether
# the socket permissions actually let nginx connect, whether systemd's sandbox
# lets the application start, and whether a certificate is really served.
#
#   make integration
services:
  # Pebble is a local ACME server built for exactly this. Tests never touch
  # Let's Encrypt: a test suite that spends real rate-limit budget is a test
  # suite people stop running.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /test/config/pebble-config.json -dnsserver 10.30.50.3:8053
    environment:
      # 0 means "validate immediately", so the suite does not wait out a random
      # delay Pebble adds by default to catch clients that assume otherwise.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      # Pebble's own config, because the image's default validates HTTP-01 on port
      # 5002 — aimed at its challenge-test server rather than at a real webserver. On
      # 5002 the harness's nginx never sees the request and every authorization comes
      # back INVALID, which looks exactly like a broken site. 80 and 443 are what a
      # real CA uses and what this suite is here to exercise.
      - ./pebble-config.json:/test/config/pebble-config.json:ro
      # Pebble's ACME endpoint is served with a static test certificate signed by
      # test/certs/pebble.minica.pem, which is *not* the root it issues from — so
      # fetching /roots/0 does not let a client verify Pebble itself. Docker
      # populates an empty named volume from the image, which shares that file with
      # the harness without a network fetch or a certificate committed to this repo.
      - pebble-certs:/test/certs
    networks:
      acmenet:
        ipv4_address: 10.30.50.2

  # A DNS server Pebble resolves through, so the harness can point a test domain
  # at the container under test without touching /etc/hosts inside Pebble.
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: -defaultIPv6 "" -defaultIPv4 10.30.50.4
    networks:
      acmenet:
        ipv4_address: 10.30.50.3

  # A real MongoDB with authentication on, so the database section exercises the
  # actual server rather than a mock. Auth matters: a mongod without it accepts every
  # command from anyone, and the users ratline creates would restrict nothing — so a
  # suite running against one would pass while proving nothing about isolation.
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: integration
    networks:
      acmenet:
        ipv4_address: 10.30.50.5

  harness:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile
    # systemd needs a real PID 1, its own cgroup namespace and a writable
    # /run and /sys/fs/cgroup. Without these the units under test cannot start,
    # and testing site supervision without systemd would test nothing.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The suite calls `systemctl exit`, which stops systemd and therefore the
      # container, the instant it finishes — so its journal is unreadable by the
      # time anything outside could ask for it. The transcript is written here
      # instead, which is also what a CI job needs to attach to a failed run.
      - ./results:/var/log/ratline-integration:rw
      # Read-only: the harness needs to trust Pebble, not to alter it.
      - pebble-certs:/pebble-certs:ro
    stop_signal: SIGRTMIN+3
    environment:
      # By hostname, not by IP. Pebble's endpoint certificate covers
      # DNS:localhost, DNS:pebble and IP:127.0.0.1 — so an https URL naming
      # 10.30.50.2 fails verification with "certificate is not valid for
      # 10.30.50.2" however well the CA itself is trusted. `pebble` is the compose
      # service name and resolves on this network.
      RATLINE_TEST_ACME_DIRECTORY: https://pebble:14000/dir
      RATLINE_TEST_CHALLTESTSRV: http://10.30.50.3:8055
      # By hostname for the same reason as Pebble. The suite writes this into
      # paths.mongo_uri_file at 0600 rather than passing it on a command line.
      RATLINE_TEST_MONGO_URI: mongodb://admin:integration@mongo:27017/?authSource=admin
    depends_on:
      - pebble
      - challtestsrv
      - mongo
    networks:
      acmenet:
        ipv4_address: 10.30.50.4

volumes:
  pebble-certs:

networks:
  acmenet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.50.0/24
