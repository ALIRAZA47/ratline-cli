name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand: `gh workflow run ci`.
  #
  # Added after a GitHub Actions outage left a run queued for eighteen hours with no jobs
  # ever created, in a state the API would not cancel — and with nothing but push and
  # pull_request as triggers, the only way to ask for a fresh run was to invent a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # The target is a VPS, and arm64 VPSes are common enough that
          # "it compiles on amd64" is not good enough.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read from go.mod rather than pinned here. It said 1.22 while go.mod
          # required 1.25, so every job silently bootstrapped a second toolchain
          # before it could compile anything — and a go.mod bump would not have
          # updated this.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -s -l . | tee /tmp/fmt
          test ! -s /tmp/fmt

      - run: go vet ./...

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build both binaries
        run: make build

      # docs/reference/commands.md is generated from the binary, and CONTRIBUTING says not
      # to hand-edit it — but nothing checked that it had been regenerated. A flag whose
      # help text changed leaves the published reference describing the old behaviour, and
      # a reference that is wrong is worse than one that is missing.
      - name: The generated command reference matches the binary
        # Once is enough: the help text does not depend on the architecture.
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          make docs-commands
          if ! git diff --quiet docs/reference/commands.md; then
            echo "docs/reference/commands.md is out of date. Run: make docs-commands"
            git diff docs/reference/commands.md
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          ./bin/ratline version
          ./bin/ratline --help
          # Every command's help must render. A broken template, a missing group ID or
          # a duplicate flag registration is a panic at construction time, and it must
          # not be something a server discovers. Covers the commands the integration
          # suite never reaches — backup, status, troubleshoot, explain, update — for
          # which this is the only automated exercise they get.
          for group in user key site cert runtime db init backup doctor status \
                       troubleshoot explain reconcile export update version man; do
            ./bin/ratline "$group" --help >/dev/null
          done
          # Subcommands too, which is where a bad annotation actually hides. Both
          # spellings: `help <cmd>` is a different code path from `<cmd> --help`, and
          # it used to refuse without root.
          for sub in "user add" "site add" "cert issue" "key add" "cert renew" "site deploy" \
                     "db create" "db user add" "db user password" "db user grant"; do
            ./bin/ratline help $sub >/dev/null
            ./bin/ratline $sub --help >/dev/null
          done
          # Every embedded explainer page. `explain` is a documentation command, so a
          # page that fails to render is the entire failure, and the topic list comes
          # from the binary rather than being duplicated here.
          ./bin/ratline explain | awk 'NR>1 && NF>1 && $1 ~ /^[a-z][a-z-]*$/ {print $1}' > /tmp/topics
          test -s /tmp/topics
          while read -r topic; do
            ./bin/ratline explain "$topic" >/dev/null
          done < /tmp/topics
          ./bin/ratline completion bash >/dev/null
          ./bin/ratline man >/dev/null

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read from go.mod rather than pinned here. It said 1.22 while go.mod
          # required 1.25, so every job silently bootstrapped a second toolchain
          # before it could compile anything — and a go.mod bump would not have
          # updated this.
          go-version-file: go.mod
          cache: true
      # v6 ran on Node 20, which GitHub Actions has deprecated. v7 and later require
      # golangci-lint v2, so .golangci.yml was migrated to the v2 schema to match.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2


  fuzz:
    name: fuzz the validators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read from go.mod rather than pinned here. It said 1.22 while go.mod
          # required 1.25, so every job silently bootstrapped a second toolchain
          # before it could compile anything — and a go.mod bump would not have
          # updated this.
          go-version-file: go.mod
          cache: true
      # Short runs on every push; a crash found here is a real input that would
      # have reached a config file or a command line.
      #
      # Budgeted in executions rather than seconds. With `-fuzztime 20s` the coordinator
      # can cancel its context while a worker call is still in flight and report
      # "context deadline exceeded" as a FAIL — no crasher, no failing input, just the
      # deadline landing badly. It failed a build that way after 1.1M executions of
      # FuzzAppModule. A red CI job that means nothing is worse than no job, because the
      # next real failure gets ignored with it.
      - name: Fuzz
        run: |
          for target in FuzzUsername FuzzDomain FuzzResolveWithin FuzzAppModule FuzzSlug; do
            go test -run '^$' -fuzz "$target" -fuzztime 300000x ./internal/validate
          done
          go test -run '^$' -fuzz FuzzParseCommand -fuzztime 300000x ./internal/system

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-corpus
          path: |
            internal/validate/testdata/fuzz/
            internal/system/testdata/fuzz/

  docs:
    name: docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/web/package-lock.json
      - run: npm --prefix docs/web ci
      - name: Typecheck and build
        run: npm --prefix docs/web run build
      # Vercel deploys on push, so a broken build or a stale CSP hash would first be
      # noticed by a visitor. The hash pins the one inline script — the theme switch,
      # which must run before first paint — and editing even a comment in it changes
      # the hash and gets the script blocked with only a console error to say so.
      - name: The CSP hash still matches the build
        run: sh scripts/check-csp-hash.sh
      # A dangling internal link is invisible until a reader clicks it, and the site is
      # the project's public face. Adding the databases group nearly shipped a link to a
      # concepts page that was never written.
      - name: Every internal documentation link resolves
        run: python3 scripts/check-doc-links.py
      # The installer is served from the site, so it has to survive the build and stay
      # syntactically valid: it is piped straight into a root shell.
      - name: The installer is present and valid
        run: |
          test -f docs/web/dist/install.sh
          sh -n docs/web/dist/install.sh
          command -v shellcheck >/dev/null 2>&1 && shellcheck -s sh docs/web/dist/install.sh || true

  integration:
    name: integration (real nginx, node, python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read from go.mod rather than pinned here. It said 1.22 while go.mod
          # required 1.25, so every job silently bootstrapped a second toolchain
          # before it could compile anything — and a go.mod bump would not have
          # updated this.
          go-version-file: go.mod
          cache: true
      - name: Run the integration suite
        run: make integration
