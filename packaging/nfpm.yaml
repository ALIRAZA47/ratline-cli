# nfpm configuration. Build with:
#   VERSION=1.0.0 ARCH=amd64 nfpm package --config packaging/nfpm.yaml --packager deb
name: ratline
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: ratline maintainers
description: |
  Provision isolated users, sites and certificates on a single server.
  ratline creates a system account per tenant, an nginx vhost and a systemd
  service per site, and manages TLS certificates as a first-class resource.
  Static, Node and Python runtimes; no containers, no daemon, no web UI.
vendor: ratline
homepage: https://github.com/ALIRAZA47/ratline-cli
license: MIT

# Recommends rather than Depends: ratline is useful for inspecting a server
# before either is installed, and `doctor` says what is missing.
recommends:
  - nginx
  - certbot
suggests:
  - python3-venv
  - rsync
  - git

contents:
  - src: dist/ratline-linux-${ARCH}
    dst: /usr/local/bin/ratline
    file_info:
      mode: 0755
      owner: root
      group: root

  # The forced-command wrapper. Root-owned and not group-writable, because it
  # runs on every site-scoped SSH connection.
  - src: dist/ratline-shell-linux-${ARCH}
    dst: /usr/local/lib/ratline/ratline-shell
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: packaging/systemd/ratline-cert-renew.service
    dst: /etc/systemd/system/ratline-cert-renew.service
  - src: packaging/systemd/ratline-cert-renew.timer
    dst: /etc/systemd/system/ratline-cert-renew.timer
  - src: packaging/systemd/ratline-key-prune.service
    dst: /etc/systemd/system/ratline-key-prune.service
  - src: packaging/systemd/ratline-key-prune.timer
    dst: /etc/systemd/system/ratline-key-prune.timer

  - src: docs/README.md
    dst: /usr/share/doc/ratline/README.md
  - src: docs/SECURITY.md
    dst: /usr/share/doc/ratline/SECURITY.md
  - src: docs/SSH.md
    dst: /usr/share/doc/ratline/SSH.md

  # Directories, with the modes ratline expects. Credentials are 0700.
  - dst: /etc/ratline
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /etc/ratline/ssh
    type: dir
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /etc/ratline/dns
    type: dir
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /etc/ratline/certs
    type: dir
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /var/lib/ratline
    type: dir
    file_info: {mode: 0750, owner: root, group: root}
  - dst: /var/log/ratline
    type: dir
    file_info: {mode: 0750, owner: root, group: root}
  - dst: /var/www/ratline-acme
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /opt/ratline/runtimes
    type: dir
    file_info: {mode: 0755, owner: root, group: root}

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
