# nfpm configuration for the panel. Build with:
#   VERSION=1.0.0 ARCH=amd64 nfpm package --config packaging/nfpm-panel.yaml --packager deb
#
# A separate package from ratline, not a component of it. The panel is a daemon that
# listens on a port; ratline is a tool an operator runs. A server that never wants a
# web interface should not have one installed as a side effect of installing the
# provisioning tool, and removing the panel must never take ratline with it.
name: ratline-panel
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: ratline maintainers
description: |
  A web interface for ratline.
  ratline-panel runs as a service on a ratline server, listens on a port and can
  be put behind a domain with a certificate. It reimplements nothing: every action
  runs the ratline binary with --json and reads the envelope, so a mutation made
  in a browser is staged, verified and rolled back by the same code that would
  have run over SSH. Two roles: a super admin who invites others and runs the
  irreversible operations, and an admin who runs the server day to day.
vendor: ratline
homepage: https://github.com/ALIRAZA47/ratline-cli
license: MIT

# Depends, not Recommends. The panel does nothing without ratline — it is a caller
# of that binary and refuses to start without it — so installing one without the
# other produces a service that fails at boot and says why in a journal nobody is
# reading yet.
depends:
  - ratline
recommends:
  - nginx
  - certbot

contents:
  - src: dist/ratline-panel-linux-${ARCH}
    dst: /usr/local/bin/ratline-panel
    file_info:
      mode: 0755
      owner: root
      group: root

  # Not enabled by the package. `ratline-panel install` writes the configuration,
  # creates the database and enables the unit — and a package that started a
  # root-equivalent web service at install time, before anybody had claimed it,
  # would be handing the server to whoever found the port first.
  - src: templates/panel/ratline-panel.service
    dst: /usr/lib/systemd/system/ratline-panel.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: docs/topics/panel.md
    dst: /usr/share/doc/ratline-panel/panel.md

scripts:
  postinstall: packaging/panel-postinstall.sh
  preremove: packaging/panel-preremove.sh
