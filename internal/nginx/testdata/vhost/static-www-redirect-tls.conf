# managed-by: ratline
# site: example.com
# owner: alice
# runtime: static
# generated: <normalised>
#
# Do not edit. Add your own directives to:
#   /etc/nginx/ratline/custom/example.com.conf


# Canonical host redirect, before the main server block so it wins.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    include /etc/nginx/ratline/ssl-params.conf;
    server_name www.example.com;

    # ACME first: renewal must never depend on a redirect.
    include /etc/nginx/ratline/acme-challenge.conf;

    return 301 https://example.com$request_uri;
}

# Plain HTTP: serve the ACME challenge, redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    include /etc/nginx/ratline/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    include /etc/nginx/ratline/ssl-params.conf;

    include /etc/nginx/ratline/security-headers.conf;

    # The single most common cause of a mystery 413.
    client_max_body_size 20M;

    access_log /home/alice/example.com/logs/access.log;
    error_log  /home/alice/example.com/logs/error.log warn;

    # Serve the challenge even when the site is disabled or the app is down.
    include /etc/nginx/ratline/acme-challenge.conf;
    include /etc/nginx/ratline/deny-hidden.conf;

    root /home/alice/example.com/public;
    index index.html;

    # Content-hashed assets never change under the same name, so they can be
    # cached indefinitely.
    location ~* ^/(assets|_next/static|static)/ {
        # Repeated deliberately: nginx's add_header does not merge with an inherited
        # set, it replaces it. Without this the Cache-Control below would silently
        # drop every security header for exactly the paths a browser fetches most.
        include /etc/nginx/ratline/security-headers.conf;
        expires 31536000s;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # The entry document must not be cached, or a deploy will not be visible.
    location = /index.html {
        # See the note above: add_header replaces rather than merges, and this is the
        # most-requested path on the site.
        include /etc/nginx/ratline/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Operator additions. Regenerating this file never touches that one.
    include /etc/nginx/ratline/custom/example.com.conf;
}
