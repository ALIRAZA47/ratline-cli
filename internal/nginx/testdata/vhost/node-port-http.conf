# managed-by: ratline
# site: example.com
# owner: alice
# runtime: node
# generated: <normalised>
#
# Do not edit. Add your own directives to:
#   /etc/nginx/ratline/custom/example.com.conf


server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    include /etc/nginx/ratline/security-headers.conf;

    # The single most common cause of a mystery 413.
    client_max_body_size 20M;

    access_log /home/alice/example.com/logs/access.log;
    error_log  /home/alice/example.com/logs/error.log warn;

    # Serve the challenge even when the site is disabled or the app is down.
    include /etc/nginx/ratline/acme-challenge.conf;
    include /etc/nginx/ratline/deny-hidden.conf;

    location / {
        proxy_pass http://127.0.0.1:20001;
        include /etc/nginx/ratline/proxy-params.conf;
        proxy_read_timeout 1m0s;
        proxy_buffering on;
    }

    location @app {
        proxy_pass http://127.0.0.1:20001;
        include /etc/nginx/ratline/proxy-params.conf;
        proxy_read_timeout 1m0s;
        proxy_buffering on;
    }

    # Operator additions. Regenerating this file never touches that one.
    include /etc/nginx/ratline/custom/example.com.conf;
}
