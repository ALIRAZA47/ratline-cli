# managed-by: ratline
# site: example.com
# owner: alice
# runtime: node
# generated: <normalised>
#
# Do not edit. Add your own directives to:
#   /etc/nginx/ratline/custom/example.com.conf


server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # A tenant owns their document root and can put a symlink in it. nginx's worker
    # follows one to wherever it points, so a link to a world-readable file of root's
    # — /etc/passwd — would be served to the internet as if it were the site's own.
    # if_not_owner serves a link only when it and its target belong to the same user,
    # which a tenant's own release layout does and a link out of their tree does not.
    disable_symlinks if_not_owner from=$document_root;

    include /etc/nginx/ratline/security-headers.conf;

    # The single most common cause of a mystery 413.
    client_max_body_size 20M;

    access_log /var/log/nginx/ratline/alice-example_com/access.log;
    error_log  /var/log/nginx/ratline/alice-example_com/error.log warn;

    # Serve the challenge even when the site is disabled or the app is down.
    include /etc/nginx/ratline/acme-challenge.conf;
    include /etc/nginx/ratline/deny-hidden.conf;

    location / {
        proxy_pass http://unix:/run/ratline/alice-example_com/app.sock:;
        include /etc/nginx/ratline/proxy-params.conf;
        proxy_read_timeout 1m0s;
        proxy_buffering on;
    }

    location @app {
        proxy_pass http://unix:/run/ratline/alice-example_com/app.sock:;
        include /etc/nginx/ratline/proxy-params.conf;
        proxy_read_timeout 1m0s;
        proxy_buffering on;
    }

    # Operator additions. Regenerating this file never touches that one.
    include /etc/nginx/ratline/custom/example.com.conf;
}
