# managed-by: ratline
#
# Headers that are safe for every site. Anything that can break a working
# application — HSTS, CSP, Permissions-Policy — is opt-in per site instead,
# because a header that breaks a tenant's payment flow is not a security win.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Do not advertise the nginx version.
server_tokens off;
