# managed-by: ratline
#
# Paths that must never be served, even if someone puts them under the document
# root. .env is the one that matters most: a leaked database URL is a full
# compromise, and it has happened to every hosting platform that did not do this.
#
# ^~ takes precedence over regular expression locations, so these win regardless
# of what a custom include adds later.

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~ ^/(\.env|\.git|\.svn|\.hg|\.ratline) {
    deny all;
    return 404;
}

location ~* /(node_modules|venv|__pycache__|vendor)/ {
    deny all;
    return 404;
}

location ~* ^/(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|composer\.json|composer\.lock|requirements\.txt|pyproject\.toml|poetry\.lock|Dockerfile|docker-compose\.ya?ml|Makefile)$ {
    deny all;
    return 404;
}

location ~* \.(sql|sqlite|sqlite3|db|bak|old|orig|save|swp|log|pem|key|crt|p12|pfx)$ {
    deny all;
    return 404;
}
