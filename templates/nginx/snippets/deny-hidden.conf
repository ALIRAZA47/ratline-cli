# managed-by: ratline
#
# Paths that must never be served, even if someone puts them under the document
# root. .env is the one that matters most: a leaked database URL is a full
# compromise, and it has happened to every hosting platform that did not do this.
#
# These are regular-expression locations. nginx tries them in order, after the
# longest matching prefix, so a `location =` or `location ^~` in a custom include
# still beats them. Don't add one of those for a dotted path unless you mean it.
#
# /.well-known/ (RFC 8615) is the one dotted path a site has to answer. OAuth
# discovery for MCP clients, security.txt, apple-app-site-association and
# change-password live there. Denying it 404'd every one of those while nginx
# logged nothing. The lookahead exempts /.well-known/ at the root only. The second
# branch refuses one nested deeper (/assets/.well-known/), and a hidden file
# inside it (/.well-known/.env) still matches at its own "/.". The ACME
# challenge has its own ^~ location and never reaches this rule.

location ~ /\.(?!well-known/)|^/.+/\.well-known/ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~ ^/(\.env|\.git|\.svn|\.hg|\.ratline) {
    deny all;
    return 404;
}

location ~* /(node_modules|venv|__pycache__|vendor)/ {
    deny all;
    return 404;
}

location ~* ^/(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|composer\.json|composer\.lock|requirements\.txt|pyproject\.toml|poetry\.lock|Dockerfile|docker-compose\.ya?ml|Makefile)$ {
    deny all;
    return 404;
}

location ~* \.(sql|sqlite|sqlite3|db|bak|old|orig|save|swp|log|pem|key|crt|p12|pfx)$ {
    deny all;
    return 404;
}
