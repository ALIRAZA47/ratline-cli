# managed-by: ratline
#
# The HTTP-01 challenge location, included by every vhost ratline generates,
# before any redirect and regardless of whether the site is enabled.
#
# This is deliberate: renewal must never depend on an application being up, on a
# redirect behaving, or on the site being enabled. A certificate that cannot
# renew because the app is crash-looping is a much worse outage than the crash.

location ^~ /.well-known/acme-challenge/ {
    root {{ .ACMEWebroot }};
    default_type "text/plain";
    allow all;
    auth_basic off;
    access_log off;
    try_files $uri =404;
}
