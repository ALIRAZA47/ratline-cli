# managed-by: ratline
#
# TLS settings, following Mozilla's intermediate profile: every browser and
# client from the last decade, without the ciphers that are only there for
# Windows XP.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# A shared cache across workers, so a resumed connection does not need a full
# handshake. Tickets are off because they weaken forward secrecy.
ssl_session_cache shared:ratline_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling saves the client a round trip to the CA — but only when the
# certificate actually names an OCSP responder. Let's Encrypt stopped advertising one
# in 2026, and `ssl_stapling on` against such a certificate makes nginx warn on every
# test and reload. So the ssl_stapling directives are emitted per-vhost (see the vhost
# template), only when the attached certificate carries a responder URL — not here,
# where they would apply to every certificate unconditionally.
#
# The resolver stays: it is what stapling uses to reach the responder when a vhost does
# enable it, and it is harmless when none does.
resolver 127.0.0.53 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
resolver_timeout 5s;
