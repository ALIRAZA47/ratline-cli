# managed-by: ratline
#
# What an application behind nginx needs to know about the request it is
# actually serving.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket and Server-Sent Events. $connection_upgrade is defined in
# ratline-http.conf so that a plain request sends "close" rather than a stray
# "upgrade", which some frameworks reject.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;

# Let the application decide its own error pages rather than replacing a
# considered 500 page with nginx's.
proxy_intercept_errors off;
proxy_redirect off;
