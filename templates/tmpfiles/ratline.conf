# managed-by: ratline
#
# The shared parent of every site's socket directory. Each tenant must be able to traverse
# it to bind its own socket in the 0750 subdirectory systemd creates below, and nginx must
# be able to reach through it to proxy there.
#
# Anything that creates this directory decides that for every site. ratline used to create
# it 0750 root-owned while staging a mongosh script — so on a server where `db ping` ran
# before the first socket site existed, every later site failed with
#
#	connection to /run/ratline/<slug>/app.sock failed: [Errno 13] Permission denied
#
# and nginx answered 502. /run is tmpfs, so this has to be re-established on every boot
# rather than fixed once.
d /run/ratline 0755 root root -
